<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Practice Quiz{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1ea;          /* warm paper */
    --bg-2: #ebe7dd;
    --card: #fffdf8;
    --ink: #1b1f2a;
    --ink-2: #4a505e;
    --muted: #7a8090;
    --line: #e2ddd1;
    --accent: #1f4e79;      /* deep blue */
    --accent-2: #2d6aa3;
    --accent-ink: #ffffff;
    --accent-soft: #e3ecf6;
    --ok: #2a7a4b;
    --ok-soft: #e1f2e6;
    --warn: #b8541a;
    --warn-soft: #fbe9dd;
    --bar: #9fbbd8;
    --bar-ok: #7cc49a;
    --shadow: 0 1px 2px rgba(27,31,42,.06), 0 8px 24px -12px rgba(27,31,42,.18);
    --radius: 14px;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161b; --bg-2: #1b1e25; --card: #1f232b; --ink: #ecebe6; --ink-2: #b9bcc5; --muted: #858b98;
      --line: #2e323b; --accent: #7fb0e6; --accent-2: #9cc3ee; --accent-ink: #0f1620; --accent-soft: #223345;
      --ok: #7ed19c; --ok-soft: #1d3b2a; --warn: #f0a070; --warn-soft: #3d2619;
      --bar: #355a82; --bar-ok: #2f6b48;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--sans);
         min-height: 100vh; display: flex; flex-direction: column; }
  a { color: var(--accent); }

  /* ---- top bar ---- */
  .topbar { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
  .topbar .inner { max-width: 1100px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center;
                   gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; text-decoration: none;
           color: var(--ink); font-size: 1.05rem; }
  .brand .mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--accent-ink);
                 display: grid; place-items: center; font-family: var(--serif); font-weight: 600; font-size: 1.05rem; }
  .brand small { font-weight: 500; color: var(--muted); font-size: .85rem; margin-left: 2px; }
  .spacer { flex: 1; }

  main { flex: 1; width: 100%; max-width: 1100px; margin: 0 auto; padding: 28px 20px 110px; }

  /* ---- generic ---- */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px;
          box-shadow: var(--shadow); }
  .muted { color: var(--muted); }
  .small { font-size: .875rem; }
  h1 { font-family: var(--serif); font-weight: 600; letter-spacing: -.01em; font-size: 2rem; margin: 0 0 6px; }
  h2 { font-size: 1.05rem; font-weight: 600; margin: 0 0 10px; }
  .eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: .72rem; font-weight: 600; color: var(--muted); }
  .code { font-family: var(--mono); }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 500; padding: 3px 10px;
          border-radius: 999px; background: var(--bg-2); color: var(--ink-2); border: 1px solid var(--line); }
  .pill.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill .dot.live { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }

  button, .btn { font: inherit; font-weight: 500; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line);
                 background: var(--card); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center;
                 gap: 8px; line-height: 1.2; transition: background .15s, border-color .15s, transform .05s; text-decoration: none; }
  button:hover { background: var(--bg-2); }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
  button.on { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
  button:disabled { opacity: .45; cursor: default; transform: none; }
  button.lg { padding: 14px 22px; font-size: 1.05rem; border-radius: 12px; }
  .kbd { font-family: var(--mono); font-size: .7rem; padding: 1px 6px; border-radius: 5px; border: 1px solid currentColor;
         opacity: .65; }

  input[type=text], textarea { font: inherit; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line);
         background: var(--bg); color: var(--ink); width: 100%; }
  input[type=text]:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  textarea { min-height: 110px; resize: vertical; line-height: 1.5; }

  /* ---- question ---- */
  .q-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .q-text { font-family: var(--serif); font-size: 1.45rem; line-height: 1.45; margin: 0 0 22px; white-space: pre-wrap; }
  .q-text.big { font-size: clamp(1.4rem, 2.4vw, 2rem); }
  .options { display: grid; gap: 10px; }
  .option { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; border-radius: 12px; width: 100%;
            border: 1.5px solid var(--line); background: var(--bg); text-align: left; font: inherit; color: var(--ink);
            position: relative; overflow: hidden; cursor: default; transition: border-color .15s, background .15s; }
  button.option { cursor: pointer; }
  button.option:hover { border-color: var(--accent-2); background: var(--accent-soft); }
  .option .letter { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
                    font-weight: 600; font-size: .9rem; background: var(--card); border: 1.5px solid var(--line); }
  .option .body { flex: 1; font-size: 1.05rem; line-height: 1.4; }
  .option.big .body { font-size: clamp(1.05rem, 1.6vw, 1.35rem); }
  .option.selected { border-color: var(--accent); background: var(--accent-soft); }
  .option.selected .letter { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .option.correct { border-color: var(--ok); background: var(--ok-soft); }
  .option.correct .letter { background: var(--ok); color: #fff; border-color: var(--ok); }
  .option .fill { position: absolute; inset: 0 auto 0 0; background: var(--bar); opacity: .35; width: 0;
                  transition: width .5s cubic-bezier(.2,.7,.2,1); z-index: 0; }
  .option.correct .fill { background: var(--bar-ok); opacity: .5; }
  .option > * { position: relative; z-index: 1; }
  .option .count { flex: none; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink-2); min-width: 4.5em;
                   text-align: right; }

  .solution { margin-top: 22px; border-radius: 12px; padding: 16px 18px; background: var(--ok-soft); border: 1px solid transparent;
              border-left: 4px solid var(--ok); font-family: var(--serif); font-size: 1.15rem; line-height: 1.5; white-space: pre-wrap; }
  .solution .eyebrow { color: var(--ok); margin-bottom: 4px; font-family: var(--sans); }
  .answers { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 8px; }
  .answers li { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px;
                font-family: var(--serif); font-size: 1.05rem; }
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty .glyph { font-family: var(--serif); font-size: 3rem; color: var(--line); line-height: 1; margin-bottom: 10px; }

  .fade-in { animation: fade .25s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px) } to { opacity: 1; transform: none } }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
           padding: 10px 16px; border-radius: 999px; font-size: .9rem; box-shadow: var(--shadow); opacity: 0;
           pointer-events: none; transition: opacity .2s; z-index: 20; }
  .toast.show { opacity: 1; }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header class="topbar"><div class="inner">
  <a class="brand" href="/"><span class="mark">Q</span>Practice Quiz<small>{% block subtitle %}{% endblock %}</small></a>
  <span class="spacer"></span>
  {% block topbar %}{% endblock %}
</div></header>
<main>
{% block body %}{% endblock %}
</main>
<div class="toast" id="toast"></div>
<script>
  function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800); }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
</script>
{% block script %}{% endblock %}
</body>
</html>
